<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div id="status" class="status-text">Turno del Jugador X</div>
        
        <div class="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button class="resetBtn" id="resetBtn">Reiniciar juego</button>

        <div class="scoreboard">
            <div>X Ganadas: <span id="xWins">0</span></div>
            <div>O Ganadas: <span id="oWins">0</span></div>
            <div>Empates: <span id="draws">0</span></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
